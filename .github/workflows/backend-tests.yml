name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests & test-coverage checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run all tests (gofmt, vet, go test)
        run: tests/RUN_ALL.sh

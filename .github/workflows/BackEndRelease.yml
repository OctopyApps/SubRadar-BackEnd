name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests & test-coverage checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run all tests (gofmt, vet, go test)
        run: tests/RUN_ALL.sh

  build:
    name: Build & Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux   GOARCH=amd64  go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/subradar-linux-amd64       ./cmd/server
          GOOS=linux   GOARCH=arm64  go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/subradar-linux-arm64       ./cmd/server
          GOOS=darwin  GOARCH=arm64  go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/subradar-darwin-arm64      ./cmd/server
          GOOS=darwin  GOARCH=amd64  go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/subradar-darwin-amd64      ./cmd/server
          GOOS=windows GOARCH=amd64  go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/subradar-windows-amd64.exe ./cmd/server

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Read release notes
        id: notes
        run: |
          NOTES_FILE="docs/ReleaseNotes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat "$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=No release notes found for ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SubRadar Backend ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/subradar-linux-amd64
            dist/subradar-linux-arm64
            dist/subradar-darwin-arm64
            dist/subradar-darwin-amd64
            dist/subradar-windows-amd64.exe
            dist/checksums.txt
